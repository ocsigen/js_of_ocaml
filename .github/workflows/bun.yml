name: bun

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bun:
    # arm64 runs JSC's ARM64 backend, which Safari also uses
    name: bun / Ubuntu arm64 / Tests
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Update apt cache
        run: sudo apt-get update

      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Set-up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set-up bun
        uses: oven-sh/setup-bun@v2

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      # Aandreba/setup-binaryen looks for arm64-linux instead of aarch64-linux
      - name: Set-up Binaryen
        run: |
          tag=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/WebAssembly/binaryen/releases/latest)
          tag=${tag##*/}
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$tag/binaryen-$tag-aarch64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$tag/bin" >> "$GITHUB_PATH"

      - run: opam install . --deps-only --with-test

      - run: opam install .

      - run: opam exec -- make all

      # Run the JS test suite with bun (JSOO_ENGINE=bun) in place of node.
      - run: opam exec -- make tests-bun

      # Run the wasm test suite with bun. bun's JSPI does not switch stacks,
      # so effects use the CPS profile rather than the default JSPI mode.
      - run: opam exec -- make tests-bun-wasm
